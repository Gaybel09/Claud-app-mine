name: Build debug APK

on:
  push:
    branches:
      - claude/cubemine-pix-backend-setup-hzg5mi

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: >
          flutter build apk --debug
          --dart-define=API_BASE_URL=https://cubemine-pix-api.onrender.com

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubemine-pix-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
