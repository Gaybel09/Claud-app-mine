# Render Blueprint (https://render.com/docs/blueprint-spec).
# Sobe o backend FastAPI (Fase 1) com Postgres e Redis gerenciados.
#
# O worker Celery (app/workers/) ainda não está declarado aqui -- nenhuma das
# tarefas periódicas do beat_schedule (app/workers/celery_app.py) roda de
# verdade em produção via Celery Beat/worker. A tarefa diária de recompensa
# (seção 7) é a exceção: ela roda via o Cron Job declarado no fim deste
# arquivo, que só chama o endpoint admin HTTP já existente -- muito mais
# barato do que manter um Background Worker 24/7 só para isso num app
# pequeno (ver comentário no próprio serviço "cron" abaixo). A reconciliação
# de saques Pix (pix.reconcile_pending_withdrawals, a cada 5min) continua
# sem rodar em produção -- fora do escopo desta mudança.

databases:
  - name: cubemine-pix-db
    databaseName: cubemine_pix
    user: cubemine
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: cubemine-pix-api
    runtime: python
    plan: free
    region: oregon
    # download_geoip_db.py (seção "Ranking") baixa o banco GeoLite2-City pra
    # detecção de país/estado no login -- "|| true" pra um deploy nunca
    # falhar por causa disso: sem GEOIP_LICENSE_KEY ainda configurada, ou
    # se a MaxMind ficar fora do ar num deploy específico, app/core/geoip.py
    # já degrada de forma graciosa (país/estado ficam None) em vez de
    # quebrar o login.
    buildCommand: pip install -r requirements.txt && (python scripts/download_geoip_db.py || true)
    # Migrations rodam a cada deploy, antes do servidor subir -- se
    # alembic upgrade head falhar, o deploy falha e a versão anterior
    # continua no ar.
    startCommand: alembic upgrade head && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cubemine-pix-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cubemine-pix-redis
          property: connectionString
      # Credencial do Firebase Admin -- setar manualmente no dashboard depois
      # do primeiro deploy. Prefira FIREBASE_CREDENTIALS_JSON (o JSON da
      # service account colado como texto): não precisa de Secret File, e o
      # Render não oferece upload de arquivo direto por variável de ambiente.
      # FIREBASE_CREDENTIALS_FILE continua funcionando como alternativa para
      # quem preferir usar Secret Files (aponte pro caminho montado, ex:
      # /etc/secrets/<nome-do-arquivo>).
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_CREDENTIALS_FILE
        sync: false
      # Integração Pix via Efí (seção 11) -- ver .env.example/README para
      # onde conseguir cada valor no painel da Efí. EFI_CERTIFICATE_PEM (o
      # .pem combinado colado como texto, depois de converter o .p12 que a
      # Efí gera) é a via recomendada no Render -- sem Secret Files nem
      # conversão pra base64.
      - key: EFI_CLIENT_ID
        sync: false
      - key: EFI_CLIENT_SECRET
        sync: false
      - key: EFI_CERTIFICATE_PEM
        sync: false
      - key: EFI_CERTIFICATE_BASE64
        sync: false
      - key: EFI_CERTIFICATE_PATH
        sync: false
      # ATENÇÃO: "false" = Efí de PRODUÇÃO de verdade (pix.api.efipay.com.br),
      # movimenta dinheiro real. Antes de mudar para "false", confirme que
      # EFI_CLIENT_ID/EFI_CLIENT_SECRET/EFI_CERTIFICATE_PEM no dashboard já
      # são as credenciais de produção (não as de homologação) -- ver
      # README ("Migração para produção").
      - key: EFI_SANDBOX
        value: "false"
      - key: EFI_PAYER_PIX_KEY
        sync: false
      # Usada só por GET /admin/register-efi-webhook para montar a URL de
      # webhook (PUBLIC_BASE_URL + "/pix/webhook"). Não é secreta -- ajuste
      # se o host do serviço mudar (ex: domínio customizado).
      - key: PUBLIC_BASE_URL
        value: https://cubemine-pix-api.onrender.com
      # Protege GET /admin/smoke-test/pix, GET /admin/register-efi-webhook e
      # POST /admin/promote-user|demote-user (ver app/modules/admin/ e
      # README). Sem esta variável setada, as rotas respondem 404 como se
      # não existissem. Gere um valor forte com
      # `python3 -c "import secrets; print(secrets.token_urlsafe(32))"`.
      # smoke-test/register-webhook são só diagnóstico de sandbox
      # (desative antes de produção de verdade); promote-user/demote-user
      # continuam necessários -- é a única forma de criar o primeiro admin
      # do painel (GET/POST /admin/users, /admin/withdrawals, /admin/fund).
      - key: ADMIN_SMOKE_TEST_TOKEN
        sync: false
      # Painel admin -- GET /admin/fund sinaliza low_balance_alert quando
      # reward_fund.balance cai abaixo deste valor. Não é secreta.
      - key: ADMIN_FUND_LOW_THRESHOLD
        value: "50.00"
      # Segunda camada de proteção (além do token ADMIN_SMOKE_TEST_TOKEN)
      # pra GET /admin/smoke-test/pix e GET /admin/register-efi-webhook --
      # puro diagnóstico de setup, não usadas em operação normal (ver
      # app/modules/admin/router.py). Sem valor aqui = fica com o default
      # seguro (false) do código, e essas duas rotas respondem 404 mesmo
      # com o token certo. Ligue só temporariamente pelo dashboard do
      # Render se precisar diagnosticar algo, e desligue assim que terminar.
      - key: ENABLE_DIAGNOSTIC_ENDPOINTS
        sync: false
      # Integração com a AdMob Reporting API (seção 7) -- valor de
      # recompensa por sessão variável, calculado a partir do eCPM real do
      # bloco premiado. Ver README ("Valor de recompensa variável por
      # sessão") para como gerar ADMOB_REFRESH_TOKEN e onde achar
      # ADMOB_PUBLISHER_ID. Sem essas 4 variáveis, GET /admin/update-reward-config
      # (chamado 1x/dia pelo Cron Job no fim deste arquivo) só loga aviso e
      # mantém o valor vigente -- nunca falha nem derruba o deploy.
      - key: ADMOB_CLIENT_ID
        sync: false
      - key: ADMOB_CLIENT_SECRET
        sync: false
      - key: ADMOB_REFRESH_TOKEN
        sync: false
      - key: ADMOB_PUBLISHER_ID
        sync: false
      # Taxa MANUAL de conversão USD -> BRL do eCPM (a conta AdMob reporta
      # em dólar) -- não é secreta, mas atualize de vez em quando conforme
      # a cotação real mudar (ver README). O worker não busca câmbio ao vivo.
      - key: ADMOB_USD_TO_BRL_RATE
        value: "5.50"
      # Ranking (país/estado do usuário, seção "Ranking") -- conta gratuita
      # em maxmind.com/en/geolite2/signup, usada só pelo
      # scripts/download_geoip_db.py rodado no buildCommand acima. Sem essas
      # 2 variáveis, o download é pulado (deploy não falha) e a detecção de
      # país/estado fica desligada (ver app/core/geoip.py).
      - key: GEOIP_ACCOUNT_ID
        sync: false
      - key: GEOIP_LICENSE_KEY
        sync: false

  - type: keyvalue
    name: cubemine-pix-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # Rede de segurança para saques Pix presos em "processing" (seção 11,
  # correção v2) -- roda pix.reconcile_pending_withdrawals (ver
  # app/workers/celery_app.py) a cada 60s, consultando a Efí direto pra
  # todo saque parado há mais de RECONCILE_AFTER_MINUTES (3min, ver
  # app/modules/pix/service.py). Existe porque a confiabilidade do webhook
  # automático (POST /pix/webhook, /pix/webhook/pix) sozinho nunca foi
  # comprovada (ver investigação do saque #10 -- 34+ min preso em
  # "processing" até reconciliação manual) -- o webhook continua ativo para
  # resposta rápida quando funciona; este worker garante que nenhum saque
  # fica preso indefinidamente, funcione o webhook ou não.
  #
  # `--beat` embutido no mesmo processo do worker (em vez de dois serviços
  # separados, worker + beat) -- mais barato, mas só é seguro com EXATAMENTE
  # 1 instância: escalar este serviço pra mais de 1 réplica faria cada
  # instância rodar seu próprio scheduler e disparar a mesma tarefa várias
  # vezes (ao contrário do serviço web acima, sem estado, que escala sem
  # problema). Nunca aumente o "scaling"/número de instâncias deste serviço
  # sem separar worker e beat antes.
  #
  # ATENÇÃO CUSTO: ao contrário do Cron Job de update-reward-config abaixo
  # (cobrado só pelos segundos que roda), um Background Worker é cobrado
  # pelo mês inteiro, rodando ou não -- não existe tier free pra este tipo
  # de serviço no Render. O plano mais barato com Background Worker
  # ("starter") gira em torno de US$7/mês (valor aproximado -- confirme o
  # preço atual no seu dashboard do Render antes de habilitar). Apertar o
  # intervalo de checagem (60s, bem mais frequente que os 5min originais)
  # NÃO aumenta esse custo -- o processo já fica de pé 24/7 de qualquer
  # forma, então checar mais vezes é essencialmente grátis; o único motivo
  # pra não apertar ainda mais é RECONCILE_AFTER_MINUTES já ser o fator que
  # domina o pior caso de espera, não o intervalo do beat em si.
  - type: worker
    name: cubemine-pix-reconcile-worker
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.workers.celery_app worker --beat --loglevel=info --concurrency=1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: DATABASE_URL
        fromDatabase:
          name: cubemine-pix-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cubemine-pix-redis
          property: connectionString
      # MESMOS valores de produção configurados no serviço web
      # "cubemine-pix-api" -- necessários pra autenticar com a Efí
      # (efi_client.get_send_status) ao reconciliar. O Render não
      # compartilha env vars entre serviços automaticamente (a menos que
      # se use um Environment Group pelo dashboard) -- cole os mesmos
      # valores aqui depois do primeiro deploy. EFI_PAYER_PIX_KEY não é
      # necessária aqui (só usada por send_pix/register_webhook, não por
      # get_send_status).
      - key: EFI_CLIENT_ID
        sync: false
      - key: EFI_CLIENT_SECRET
        sync: false
      - key: EFI_CERTIFICATE_PEM
        sync: false
      - key: EFI_CERTIFICATE_BASE64
        sync: false
      - key: EFI_CERTIFICATE_PATH
        sync: false
      - key: EFI_SANDBOX
        value: "false"

  # Roda diariamente GET /admin/update-reward-config (seção 7) -- ver
  # scripts/trigger_update_reward_config.py. Escolhido em vez de agendar
  # via Celery Beat porque, para uma única tarefa 1x/dia, um Cron Job
  # (container efêmero, cobrado só pelos segundos que roda) é bem mais
  # barato do que rodar mais uma vez por dia dentro do Background Worker
  # acima -- e reaproveita o endpoint admin que já existe e já foi testado
  # manualmente. reward.update_reward_config (a task Celery equivalente)
  # continua definida em app/workers/tasks.py mas DELIBERADAMENTE fora do
  # beat_schedule do worker acima, pra não consultar a AdMob Reporting API
  # duas vezes por dia por dois mecanismos diferentes.
  #
  # ATENÇÃO: Cron Jobs no Render não têm tier free -- exigem um plano pago
  # (a partir de ~US$1/mês, cobrado só pelo tempo de execução), mesmo assim
  # ordens de magnitude mais barato que manter isso num Background Worker.
  # "schedule" é sempre interpretado em UTC pelo Render, independente da
  # região do serviço.
  - type: cron
    name: cubemine-pix-update-reward-config
    runtime: python
    plan: starter
    region: oregon
    schedule: "0 6 * * *" # 6h UTC, 1x/dia
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/trigger_update_reward_config.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: PUBLIC_BASE_URL
        value: https://cubemine-pix-api.onrender.com
      # MESMO valor configurado no serviço web "cubemine-pix-api" acima --
      # o Render não compartilha env vars entre serviços automaticamente
      # (a menos que se use um Environment Group pelo dashboard). Cole o
      # mesmo token aqui depois do primeiro deploy.
      - key: ADMIN_SMOKE_TEST_TOKEN
        sync: false

  # Roda mensalmente GET /admin/run-monthly-ranking-payout (seção
  # "Ranking") -- ver scripts/trigger_monthly_ranking_payout.py. Mesmo
  # raciocínio do Cron Job de update-reward-config acima: reaproveita o
  # endpoint admin já existente e testado, em vez de agendar via Celery
  # Beat/Background Worker.
  #
  # "0 7 1 * *": dia 1 de cada mês, 7h UTC (1h depois do Cron Job diário de
  # reward-config, sem motivo especial além de não rodar os dois exatamente
  # no mesmo minuto) -- fecha o Top 10 do mês que acabou de terminar (ver
  # _month_window em app/modules/ranking/service.py, que por padrão usa o
  # mês ANTERIOR ao dia em que roda).
  - type: cron
    name: cubemine-pix-monthly-ranking-payout
    runtime: python
    plan: starter
    region: oregon
    schedule: "0 7 1 * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/trigger_monthly_ranking_payout.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: PUBLIC_BASE_URL
        value: https://cubemine-pix-api.onrender.com
      - key: ADMIN_SMOKE_TEST_TOKEN
        sync: false
